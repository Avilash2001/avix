name: Build

# Every push/PR: test + build Avix.exe exactly like build.ps1 (GNU toolchain, --locked pins).
# A pushed tag "v*": also attach Avix.exe + Avix.exe.sha256 to that tag's release, creating it as a
# DRAFT if it doesn't exist yet (drafts are invisible to Avix's update check until you publish them).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (GNU toolchain, same as local builds)
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --locked --bin avix

      - name: Build release exe
        shell: pwsh
        run: ./build.ps1

      - name: Keep the unsigned build
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Avix-unsigned
          path: dist/Avix.exe
          if-no-files-found: error

      # ------------------------------------------------------------------ code signing (off for now)
      # SignPath Foundation signs open-source projects for free, for builds made by public CI like
      # this one. Once the project is approved (see README > Code signing):
      #   1. add the repository secret SIGNPATH_API_TOKEN,
      #   2. fill in the ids below from your SignPath project and uncomment the step,
      #   3. uncomment the copy step so the signed exe replaces dist/Avix.exe.
      # Check SignPath's GitHub Actions docs for the current input names.
      #
      # - name: Sign
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<SignPath organization id>"
      #     project-slug: "avix"
      #     signing-policy-slug: "release-signing"
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist-signed
      #
      # - name: Use the signed exe
      #   shell: pwsh
      #   run: Copy-Item dist-signed/Avix.exe dist/Avix.exe -Force

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/Avix.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/Avix.exe.sha256", "$h  Avix.exe`n")
          $mb = (Get-Item dist/Avix.exe).Length / 1MB
          "Avix.exe: {0:N1} MB, SHA-256 ``{1}``" -f $mb, $h >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Avix
          path: |
            dist/Avix.exe
            dist/Avix.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Avix
          path: dist

      - name: Attach to the release (new releases start as drafts)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/Avix.exe dist/Avix.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Avix.exe dist/Avix.exe.sha256 --draft \
              --title "Avix $TAG" \
              --notes "Built by GitHub Actions from \`$TAG\`. SHA-256 is in \`Avix.exe.sha256\`. Write the release notes, then publish." \
              --repo "$GITHUB_REPOSITORY"
          fi
