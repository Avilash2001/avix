[package]
name = "avix"
version = "0.1.6"
edition = "2021"
description = "Avix - real-time Windows performance optimizer and debloater"
license = "MIT"
repository = "https://github.com/Avilash2001/avix"
build = "build.rs"

[[bin]]
name = "avix"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
]

[build-dependencies]
embed-manifest = "1.4"
# Same version eframe already locks; used to write the 256 px icon.
png = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
